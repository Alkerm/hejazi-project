# Nginx Production Configuration for Half Link

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name halflink.sa www.halflink.sa api.halflink.sa;

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Frontend Web Application (Next.js - Port 3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.halflink.sa halflink.sa;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/www.halflink.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.halflink.sa/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Block Google & Search Engine Indexing during review
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";

    # Public Early Access Mode (Password protection removed)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Backend API Service (Fastify - Port 4000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.halflink.sa;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/www.halflink.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.halflink.sa/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Block search engines
    add_header X-Robots-Tag "noindex, nofollow, nosnippet";

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
}
