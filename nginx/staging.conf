# Nginx Configuration for Hejazi Cosmetics STAGING (Testing Environment)

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging.YOUR_DOMAIN.com staging-api.YOUR_DOMAIN.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Staging Frontend Web Application (Next.js - Port 3001)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.YOUR_DOMAIN.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/staging.YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.YOUR_DOMAIN.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Block Google & Search Engine Indexing
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";

    # 2. Password Protection (Nginx Basic Auth)
    auth_basic "Hejazi Cosmetics Staging - Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Staging Backend API Service (Fastify - Port 4001)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.YOUR_DOMAIN.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/staging.YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.YOUR_DOMAIN.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Block Search Engine Indexing
    add_header X-Robots-Tag "noindex, nofollow, nosnippet";

    # 2. Password Protection for Staging API (optional, can be bypassed for API endpoints if using CORS headers)
    # auth_basic "Hejazi Staging API";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
}
