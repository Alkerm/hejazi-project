version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hejazi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hejazi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hejazi_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hejazidb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: hejazi-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hejazi-api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      USE_IN_MEMORY_STORE: "false"
      SESSION_TTL_SECONDS: "604800"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY}
      MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_EARLY_ACCESS_MODE: ${NEXT_PUBLIC_EARLY_ACCESS_MODE:-true}
        NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY:-pk_test_2ZVdKdsdndd55wVuxgvk9WdaKYudGUEQbg61EUdy}
    container_name: hejazi-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_EARLY_ACCESS_MODE: ${NEXT_PUBLIC_EARLY_ACCESS_MODE:-true}
      NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY:-pk_test_2ZVdKdsdndd55wVuxgvk9WdaKYudGUEQbg61EUdy}

volumes:
  postgres_data:
